name: Scheduled RAG Refresh

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install langchain langchain-core langchain-chroma langchain-groq langchain-huggingface langchain-text-splitters chromadb pdfplumber httpx boto3 beautifulsoup4 python-dotenv sentence-transformers

      - name: Run refresh
        run: python rag.py --refresh
        env:
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          AWS_ACCESS_KEY_ID:      ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:             ap-south-1
          S3_BUCKET:              ${{ secrets.S3_BUCKET }}